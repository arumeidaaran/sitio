name: Integración y validación de sitio desde dev
run-name: Integración y validación de sitio desde dev

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validacion:
    name: Validar aplicación
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar formato
        run: npm exec -- prettier --check src e2e eslint.config.js playwright.config.ts

      - name: Validar código
        run: npm exec -- ng lint

      - name: Ejecutar pruebas unitarias y cobertura
        run: npm exec -- ng test --watch=false --coverage

      - name: Instalar navegadores
        run: npm exec -- playwright install --with-deps

      - name: Ejecutar pruebas de navegador
        run: npm exec -- ng e2e

      - name: Validar construcción
        run: npm exec -- ng build --base-href /sitio/
