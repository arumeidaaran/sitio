name: Promoción de sitio desde dev hacia main
run-name: Promoción de sitio desde dev hacia main

on:
  workflow_run:
    workflows:
      - Integración y validación de sitio desde dev
    types:
      - completed
    branches:
      - dev

permissions:
  contents: read

jobs:
  promocion:
    name: Promover commit validado
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest

    concurrency:
      group: sitio-promocion-main
      cancel-in-progress: false
      queue: max

    steps:
      - name: Generar token de promoción
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Promover commit validado hacia main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT_VALIDADO: ${{ github.event.workflow_run.head_sha }}
        run: |
          cuerpo=$(jq -nc \
            --arg sha "$COMMIT_VALIDADO" \
            '{base:"main",head:$sha,commit_message:"Integrar cambios validados de dev en main"}')

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$cuerpo" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/merges"
